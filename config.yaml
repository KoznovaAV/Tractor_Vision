# Tractor Vision — единый конфигурационный файл.
#
# Устраняет хардкод и рассинхрон, разбросанный по коду:
#   * image_size раньше был 384 в train и 224 в API — модель обучалась на 384,
#     а инференс шёл на 224, что резало точность в проде. Теперь размер один и
#     тот же везде (384) и читается отсюда.
#   * пути к весам и данным были захардкожены в src/api/main.py.
#   * num_classes был константой в нескольких модулях.
#   * accuracy была захардкожена в API (0.9149 / 0.7917) и не обновлялась после
#     переобучения — теперь читается из метаданных чекпоинта (см. config_loader).
#
# Файл монтируется в api-контейнер (read-only) и копируется в образ.

# Единый размер изображения для train, eval и инференса (px).
image_size: 384

# Число классов модели трактора после слияния mtz_1221 -> mtz_82.
# Должно совпадать с длиной MODEL_CLASSES в src/config/classes.py.
num_model_classes: 4
num_state_classes: 2

# Пути к данным (относительно корня проекта).
data:
  processed_dir: data/processed        # single-task дерево (train/val/test)
  dirty_clean_dir: data/dirty_clean     # multi-task дерево (train/val)
  collected_dir: data/collected         # сырой сбор коллектора до prepare_dataset

# Пути к весам.
weights:
  dir: weights
  single_task: weights/final_model.ckpt
  multi_task: weights/multi_task_best.ckpt

# Параметры API.
api:
  max_file_size_mb: 10
  allowed_extensions: [".jpg", ".jpeg", ".png"]
  version: "1.0.0"

# Fallback-метрики на случай, если в чекпоинте нет метаданных accuracy.
# Основной источник — метаданные чекпоинта; эти значения используются, только
# если чекпоинт их не содержит.
fallback_accuracy:
  single_task: null
  multi_task: 1.0000
