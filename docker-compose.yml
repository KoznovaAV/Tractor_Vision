# Tractor Vision — оркестрация сервисов.
#
# Обучение идёт локально в conda-окружении `tractor`, поэтому compose содержит
# только рантайм-сервисы: API-инференс и прогон тестов. Оба используют один
# CPU-образ.
#
#     docker compose up api
#     docker compose run --rm test

# Общие build-параметры CPU-образа.
x-build-cpu: &build-cpu
  context: .
  args:
    TORCH_VARIANT: cpu

services:
  # ---- API-сервис: CPU-инференс ------------------------------------------
  api:
    build: *build-cpu
    image: tractor-vision:cpu
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/app/weights:ro
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---- Тесты: CPU -------------------------------------------------------
  test:
    build: *build-cpu
    image: tractor-vision:cpu
    command: pytest tests/ -v --cov=src
    volumes:
      - ./data:/app/data
      - ./weights:/app/weights
